<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Data Form</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 16px;
      background: #eff3f8;
      color: #24354a;
      font-family: Inter, system-ui, sans-serif;
    }

    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px;
      background: white;
      border: 1px solid #d7dfe9;
      border-top: 4px solid #345f9d;
      border-radius: 8px;
    }

    h1 { margin: 0; font-size: 1.65rem; }
    main > p { margin: 6px 0 24px; color: #526479; }
    form p { margin: 0 0 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }

    input, select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #a7b5c5;
      border-radius: 5px;
      background: white;
      color: inherit;
      font: inherit;
    }

    button {
      padding: 10px 24px;
      border: 0;
      border-radius: 5px;
      background: #345f9d;
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #284c80; }
    :focus-visible { outline: 2px solid #345f9d; outline-offset: 2px; }
    output { margin-left: 8px; color: #236044; }
  </style>
</head>
<body>
  <main>
    <h1>Student Data Form</h1>
    <p>All fields are required.</p>

    <form id="student-form">
      <p>
        <label for="full-name">Full name</label>
        <input type="text" id="full-name" name="fullName" required>
      </p>
      <p>
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required>
      </p>
      <p>
        <label for="student-id">Student ID</label>
        <input type="text" id="student-id" name="studentId" required>
      </p>
      <p>
        <label for="program">Program of study</label>
        <input type="text" id="program" name="program" required>
      </p>
      <p>
        <label for="year">Year of study</label>
        <select id="year" name="year" required>
          <option value="">Select a year</option>
          <option>Year 1</option>
          <option>Year 2</option>
          <option>Year 3</option>
          <option>Year 4</option>
          <option>Year 5</option>
          <option>Year 6 or above</option>
        </select>
      </p>
      <button type="submit">Submit</button>
      <output id="message"></output>
    </form>
  </main>

  <script>
    const form = document.getElementById("student-form");
    const message = document.getElementById("message");

    form.onsubmit = function (event) {
      event.preventDefault();
      message.value = "Entry complete.";
    };

    form.oninput = function () {
      message.value = "";
    };
  </script>
</body>
</html>
